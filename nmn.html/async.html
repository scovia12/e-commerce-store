<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
   <style>
        body{
            background-color: black;
            
        }
        #btn{
            background-attachment: fixed;
            background-color: rgb(107, 140, 169);
            border-radius: 90px;
            height: 50px;
            width: 50px;
        }
        #users{
            color: white;
        }

</style>
</head>
<body>
    <ol id="users"></ol>
    <button id="btn" onclick="fetchusernames()">re-fetch</button>

    <script>
        async function fetchusernames(){
            const lists=document.getElementById("users")
            try{
               let usernames= await fetch("https://jsonplaceholder.typicode.com/users?_limit=20")
               if(!usernames.ok){
                throw new Error("failed to fetch")
               }
               let datas= await usernames.json()
               datas.map(user => {
                 const li=document.createElement("li");
                 li.textContent= `${user.name}&nbsp;${user.email}`;
                 lists.appendChild(li)
               });
            }catch(err){
                console.error("failed to fetch",err)
            }
        }
        
        fetchusernames()
    </script>
</body>
</html>
