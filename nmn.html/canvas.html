<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-COMMERCE SHOP!</title>

  <style>
    :root {
      --bg-color: #f2edf1;
      --card-bg: #eef5f5;
      --text-color: #333333;
      --primary: #4ba0ad;
      --danger: #347e49;
      --accent: #9cb0d8;
      --border-color: #f8f5f5;
    }

    body.dark-mode {
      --bg-color: #000;
      --card-bg: #111;
      --text-color: #e0e0e0;
      --accent: #111;
      --border-color: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .user-info {
      font-size: 14px;
      font-weight: bold;
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid var(--border-color);
      padding: 6px 15px;
      border-radius: 30px;
      background-color: var(--card-bg);
    }

    .clock {
      background-color: var(--primary);
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      min-width: 110px;
      text-align: center;
      white-space: nowrap;
    }

    .btn-cart {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-badge {
      background-color: white;
      color: var(--primary);
      border-radius: 50%;
      min-width: 22px;
      height: 22px;
      padding: 2px 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-logout {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-dark-toggle {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 50px;
    }

    .form-box {
      background-color: var(--accent);
      padding: 30px;
      border-radius: 15px;
      width: 340px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    .error-msg {
      color: #721c24;
      background-color: #f8d7da;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }

    .btn-submit {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch-text {
      text-align: center;
      font-size: 13px;
    }

    .switch-text a,
    #sign {
      color: #002699;
      text-decoration: underline;
      cursor: pointer;
    }

    #sign {
      border: none;
      background: transparent;
    }

    .dashboard-container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input,
    .sort-select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-color);
    }

    .search-input {
      flex: 1;
    }

    .category-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 8px 16px;
      border: 1px solid var(--primary);
      background-color: transparent;
      color: var(--primary);
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .category-btn.active,
    .category-btn:hover {
      background-color: var(--primary);
      color: white;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      background: white;
      border-radius: 6px;
    }

    .product-title {
      font-size: 16px;
      font-weight: bold;
    }

    .product-category {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
    }

    .product-price {
      font-size: 15px;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-add-item {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-view-details {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-view-details:hover {
      background-color: var(--primary);
      color: white;
    }

    .btn-add-item:disabled,
    .btn-view-details:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cart-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      position: fixed;
      top: 80px;
      right: 0;
      width: min(850px, 95%);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      z-index: 800;
      box-shadow: -5px 5px 20px rgba(0, 0, 0, 0.2);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    .cart-table th,
    .cart-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-actions-btn {
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin: 2px;
    }

    .btn-increase {
      background-color: var(--primary);
      color: white;
    }

    .btn-decrease {
      background-color: #f39c12;
      color: white;
    }

    .btn-remove {
      background-color: var(--danger);
      color: white;
    }

    .btn-clear {
      background-color: #c0392b;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      font-size: 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .grand-total {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-checkout {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #toast {
      visibility: hidden;
      min-width: 220px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 20px;
      padding: 10px;
      position: fixed;
      z-index: 100000;
      bottom: 30px;
      right: 30px;
      font-size: 14px;
    }

    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }

    @keyframes fadein {
      from {
        bottom: 0;
        opacity: 0;
      }

      to {
        bottom: 30px;
        opacity: 1;
      }
    }

    @keyframes fadeout {
      from {
        bottom: 30px;
        opacity: 1;
      }

      to {
        bottom: 0;
        opacity: 0;
      }
    }

    .details-modal {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      background: var(--bg-color);
      z-index: 99999;
      overflow-y: auto;
      display: block;
    }

    .details-card {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: var(--bg-color);
      padding: 30px;
    }

    .details-close {
      position: absolute;
      top: 20px;
      right: 25px;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #e74c3c;
      color: white;
      font-size: 30px;
      cursor: pointer;
      z-index: 100000;
    }

    .details-close:hover {
      background: #c0392b;
    }

    .product-details-page {
      width: 100%;
      min-height: calc(100vh - 60px);
      padding: 20px;
    }

    .back-products-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .details-main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .details-image-box {
      width: 100%;
      height: 500px;
      background: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    .details-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .details-info {
      padding: 20px;
    }

    .details-category {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .details-info h1 {
      font-size: 36px;
      margin: 10px 0 20px;
    }

    .details-description {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .details-price {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 25px;
    }

    .quantity-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .quantity-controls button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .quantity-controls strong {
      min-width: 40px;
      text-align: center;
      font-size: 22px;
    }

    .details-total {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .details-add-cart-btn {
      width: 100%;
      max-width: 300px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    body.details-page-active {
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 10px;
      }

      .header-actions {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

      .cart-section {
        top: 130px;
        width: 100%;
      }

      .cart-table {
        font-size: 12px;
      }

      .cart-table th,
      .cart-table td {
        padding: 5px;
      }

      .details-card {
        padding: 15px;
      }

      .details-main {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .details-image-box {
        height: 350px;
      }

      .details-info h1 {
        font-size: 28px;
      }

      .details-description {
        font-size: 16px;
      }

      .details-price {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">

    <div class="logo">
      🛒 E-COMMERCE SHOP!
    </div>

    <div class="header-actions hidden" id="headerActions">

      <div class="clock" id="clock">
        00:00
      </div>

      <div class="nav-links">

        <button
          type="button"
          class="btn-dark-toggle"
          onclick="toggleDarkMode()">
          Mode
        </button>

        <button
          type="button"
          class="btn-cart"
          onclick="toggleCartView()">
          Cart
          <span class="cart-badge" id="cartBadge">0</span>
        </button>

      </div>

      <div class="user-info" id="userInfoDisplay"></div>

      <button
        type="button"
        class="btn-logout"
        onclick="handleLogout()">
        Logout
      </button>

    </div>

  </header>


  <div class="auth-container">

    <form class="form-box" id="signupForm">

      <h2>Sign Up</h2>

      <div class="error-msg" id="signupError"></div>

      <div class="form-group">

        <label>User name:</label>

        <input
          type="text"
          id="signupUser"
          required>

      </div>

      <div class="form-group">

        <label>Email:</label>

        <input
          type="email"
          id="signupEmail"
          required>

      </div>

      <div class="form-group">

        <label>Password:</label>

        <input
          type="password"
          id="signupPass"
          required>

      </div>

      <button
        type="submit"
        class="btn-submit">
        Sign Up
      </button>

      <p class="switch-text">
        Already have an account?
        <a
          href="#"
          onclick="showLoginForm(); return false;">
          Log in here
        </a>
      </p>

    </form>


    <form
      class="form-box hidden"
      id="loginForm">

      <h2>Log In</h2>

      <div class="error-msg" id="loginError"></div>

      <div class="form-group">

        <label>Email:</label>

        <input
          type="email"
          id="loginEmail"
          required>

      </div>

      <div class="form-group">

        <label>Password:</label>

        <input
          type="password"
          id="loginPass"
          required>

      </div>

      <button
        type="submit"
        class="btn-submit">
        Log In
      </button>

      <p class="switch-text">
        Don't have an account?

        <button
          type="button"
          id="sign"
          onclick="showSignupForm()">
          Sign up here
        </button>

      </p>

    </form>

  </div>


  <div
    class="dashboard-container hidden"
    id="dashboardSection">

    <div
      class="cart-section hidden"
      id="cartSection">

      <div class="cart-header">

        <h2>
          Shopping Cart
        </h2>

        <button
          type="button"
          class="btn-clear"
          onclick="clearCart()">
          Clear Cart
        </button>

        <button
          type="button"
          class="btn-clear"
          onclick="closeCart()">
          Close Cart
        </button>

      </div>

      <table class="cart-table">

        <thead>

          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Line Total</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="cartTableBody"></tbody>

      </table>

      <div class="cart-summary">

        <div>
          Subtotal:
          <span id="subtotalVal">0 RWF</span>
        </div>

        <div>
          VAT (18%):
          <span id="vatVal">0 RWF</span>
        </div>

        <div class="grand-total">
          Grand Total:
          <span id="grandTotalVal">0 RWF</span>
        </div>

        <button
          type="button"
          class="btn-checkout"
          onclick="checkout()">
          Proceed to Checkout
        </button>

      </div>

    </div>


    <div class="filter-section">

      <div class="controls-row">

        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search products by name...">

        <select
          id="sortSelect"
          class="sort-select">

          <option
            value="high-low"
            selected>
            Price: High to Low
          </option>

          <option value="low-high">
            Price: Low to High
          </option>

        </select>

      </div>


      <div class="category-buttons">

        <button
          type="button"
          class="category-btn active"
          onclick="filterCategory('All Products', this)">
          All Products
        </button>

        <button
          type="button"
          class="category-btn"
          onclick="filterCategory('Electronics', this)">
          Electronics
        </button>

        <button
          type="button"
          class="category-btn"
          onclick="filterCategory('Clothes', this)">
          Clothes
        </button>

        <button
          type="button"
          class="category-btn"
          onclick="filterCategory('Shoes', this)">
          Shoes
        </button>

        <button
          type="button"
          class="category-btn"
          onclick="filterCategory('Food', this)">
          Food
        </button>

      </div>

    </div>


    <div
      class="product-grid"
      id="productGrid">
    </div>

  </div>


  <div id="toast"></div>


  <div
    class="details-modal hidden"
    id="detailsModal"
    onclick="closeProductDetails(event)">

    <div
      class="details-card"
      onclick="event.stopPropagation()">

      <button
        type="button"
        class="details-close"
        onclick="closeProductDetails()"
        aria-label="Close">
        &times;
      </button>

      <div id="detailsContent"></div>

    </div>

  </div>

        name: "Fresh Salad",
        category: "Food",
        price: 7000,
        image: "s.png",
        description: "A fresh and healthy salad made with quality ingredients."
      },

      {
        id: 16,
        name: "Chocolate Cake",
        category: "Food",
        price: 15000,
        image: "t.png",
        description: "A delicious chocolate cake with a rich chocolate flavor."
      }

    ];


    let cart =
      JSON.parse(localStorage.getItem("userCart")) || [];

    let selectedCategory = "All Products";


    const signupForm =
      document.getElementById("signupForm");

    const loginForm =
      document.getElementById("loginForm");

    const dashboardSection =
      document.getElementById("dashboardSection");

    const headerActions =
      document.getElementById("headerActions");

    const userInfoDisplay =
      document.getElementById("userInfoDisplay");

    const productGrid =
      document.getElementById("productGrid");

    const searchInput =
      document.getElementById("searchInput");

    const sortSelect =
      document.getElementById("sortSelect");

    const cartSection =
      document.getElementById("cartSection");

    const cartTableBody =
      document.getElementById("cartTableBody");

    const cartBadge =
      document.getElementById("cartBadge");

    const detailsModal =
      document.getElementById("detailsModal");

    const detailsContent =
      document.getElementById("detailsContent");

    const filterSection =
      document.querySelector(".filter-section");


    function updateKigaliClock() {

      const clock =
        document.getElementById("clock");

      if (!clock) {
        return;
      }

      const now = new Date();

      clock.textContent =
        new Intl.DateTimeFormat("en-US", {
          timeZone: "Africa/Kigali",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true
        }).format(now);

    }


    updateKigaliClock();

    setInterval(updateKigaliClock, 1000);


    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent =
        "Success: " + message;

      toast.classList.add("show");

      setTimeout(function () {
        toast.classList.remove("show");
      }, 3000);

    }


    window.showToast = showToast;


    signupForm.addEventListener("submit", function (e) {

      e.preventDefault();

      const username =
        document.getElementById("signupUser").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim().toLowerCase();

      const password =
        document.getElementById("signupPass").value;

      const errorDiv =
        document.getElementById("signupError");

      errorDiv.style.display = "none";

      let users =
        JSON.parse(localStorage.getItem("users")) || [];

      const userExists =
        users.find(function (user) {

          return (
            user.email === email ||
            user.username.toLowerCase() === username.toLowerCase()
          );

        });


      if (userExists) {

        errorDiv.textContent =
          "An account with this Email or Username already exists!";

        errorDiv.style.display = "block";

        return;
      }


      users.push({
        username: username,
        email: email,
        password: password
      });


      localStorage.setItem(
        "users",
        JSON.stringify(users)
      );


      alert(
        "Account created successfully! Please log in."
      );


      signupForm.reset();

      showLoginForm();

    });


    loginForm.addEventListener("submit", function (e) {

      e.preventDefault();

      const email =
        document.getElementById("loginEmail").value.trim().toLowerCase();

      const password =
        document.getElementById("loginPass").value;

      const errorDiv =
        document.getElementById("loginError");

      errorDiv.style.display = "none";

      let users =
        JSON.parse(localStorage.getItem("users")) || [];


      const user =
        users.find(function (user) {

          return user.email === email;

        });


      if (!user) {

        errorDiv.textContent =
          "User not found. Please check your email or sign up.";

        errorDiv.style.display = "block";

        return;
      }


      if (user.password !== password) {

        errorDiv.textContent =
          "Incorrect password. Please try again.";

        errorDiv.style.display = "block";

        return;
      }


      localStorage.setItem(
        "currentUser",
        JSON.stringify(user)
      );


      loginForm.reset();

      showDashboard();

    });


    function handleLogout() {

      localStorage.removeItem("currentUser");

      localStorage.removeItem("selectedProductId");

      closeCart();

      closeProductDetails();

      showLoginForm();

    }


    window.handleLogout = handleLogout;


    function displayProducts(items) {

      productGrid.innerHTML = "";


      if (items.length === 0) {

        productGrid.innerHTML =
          "<p>No products found matching your search.</p>";

        return;
      }


      items.forEach(function (product) {

        const card =
          document.createElement("div");

        card.className = "product-card";


        card.innerHTML = `

          <img
            src="${product.image}"
            alt="${product.name}"
            onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">

          <div class="product-title">
            ${product.name}
          </div>

          <div class="product-category">
            ${product.category}
          </div>

          <div class="product-price">
            ${product.price.toLocaleString()} RWF
          </div>

          <button
            type="button"
            class="btn-add-item"
            onclick="addToCart(${product.id})">
            Add to Cart
          </button>

          <button
            type="button"
            class="btn-view-details"
            onclick="showPleaseWait(this, ${product.id})">
            View Details
          </button>

        `;


        productGrid.appendChild(card);

      });

    }


    window.displayProducts = displayProducts;


    function filterProducts() {

      const searchTerm =
        searchInput.value.toLowerCase().trim();


      let filtered =
        products.filter(function (product) {

          const matchesName =
            product.name
              .toLowerCase()
              .includes(searchTerm);

          const matchesCategory =
            selectedCategory === "All Products" ||
            product.category === selectedCategory;

          return matchesName && matchesCategory;

        });


      if (sortSelect.value === "low-high") {

        filtered.sort(function (a, b) {
          return a.price - b.price;
        });

      } else {

        filtered.sort(function (a, b) {
          return b.price - a.price;
        });

      }


      displayProducts(filtered);

    }


    window.filterProducts = filterProducts;


    searchInput.addEventListener(
      "input",
      filterProducts
    );


    sortSelect.addEventListener(
      "change",
      filterProducts
    );


    function filterCategory(category, button) {

      selectedCategory = category;


      document
        .querySelectorAll(".category-btn")
        .forEach(function (btn) {

          btn.classList.remove("active");

        });


      if (button) {
        button.classList.add("active");
      }


      filterProducts();

    }


    window.filterCategory = filterCategory;


    function saveCart() {

      localStorage.setItem(
        "userCart",
        JSON.stringify(cart)
      );

      updateCartUI();

    }


    window.saveCart = saveCart;


    function addToCart(productId) {

      productId = Number(productId);


      const product =
        products.find(function (p) {
          return p.id === productId;
        });


      if (!product) {
        return;
      }


      const cartItem =
        cart.find(function (item) {
          return item.id === productId;
        });


      if (cartItem) {

        cartItem.quantity += 1;

      } else {

        cart.push({
          id: product.id,
          name: product.name,
          category: product.category,
          price: product.price,
          image: product.image,
          description: product.description,
          quantity: 1
        });

      }


      saveCart();


      showToast(
        product.name + " added to cart!"
      );

    }


    window.addToCart = addToCart;


    function showPleaseWait(button, productId) {

      if (!button || button.disabled) {
        return;
      }


      button.disabled = true;

      button.textContent =
        "Please wait...";


      alert(
        "Please wait. Product details will open shortly."
      );


      setTimeout(function () {

        button.disabled = false;

        button.textContent =
          "View Details";

        viewProductDetails(productId);

      }, 800);

    }


    window.showPleaseWait = showPleaseWait;


    function viewProductDetails(productId) {

      const product =
        products.find(function (p) {

          return p.id === Number(productId);

        });


      if (!product) {
        return;
      }


      localStorage.setItem(
        "selectedProductId",
        String(productId)
      );


      const cartItem =
        cart.find(function (item) {

          return item.id === Number(productId);

        });


      const quantity =
        cartItem ? cartItem.quantity : 1;


      filterSection.classList.add("hidden");

      productGrid.classList.add("hidden");

      cartSection.classList.add("hidden");


      detailsContent.innerHTML = `

        <div class="product-details-page">

          <button
            type="button"
            class="back-products-btn"
            onclick="closeProductDetails()">

            ← Back to Products

          </button>


          <div class="details-main">


            <div class="details-image-box">

              <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://via.placeholder.com/600x500?text=No+Image'">

            </div>


            <div class="details-info">

              <span class="details-category">
                ${product.category}
              </span>


              <h1>
                ${product.name}
              </h1>


              <p class="details-description">
                ${product.description}
              </p>


              <div class="details-price">
                ${product.price.toLocaleString()} RWF
              </div>


              <div class="quantity-title">
                Quantity
              </div>


              <div class="quantity-controls">

                <button
                  type="button"
                  onclick="changeDetailsQuantity(${product.id}, -1)">
                  −
                </button>

                <strong id="detailsQuantity">
                  ${quantity}
                </strong>

                <button
                  type="button"
                  onclick="changeDetailsQuantity(${product.id}, 1)">
                  +
                </button>

              </div>


              <div class="details-total">

                Total:
                <strong id="detailsTotal">
                  ${(product.price * quantity).toLocaleString()} RWF
                </strong>

              </div>


              <button
                type="button"
                class="details-add-cart-btn"
                onclick="addDetailsToCart(${product.id})">

                🛒 Add to Cart

              </button>

            </div>

          </div>

        </div>

      `;


      detailsModal.classList.remove("hidden");

      document.body.classList.add(
        "details-page-active"
      );

      document.body.style.overflow = "hidden";

      window.scrollTo(0, 0);

    }


    window.viewProductDetails =
      viewProductDetails;


    function changeDetailsQuantity(
      productId,
      change
    ) {

      const product =
        products.find(function (p) {

          return p.id === Number(productId);

        });


      const quantityElement =
        document.getElementById(
          "detailsQuantity"
        );


      const totalElement =
        document.getElementById(
          "detailsTotal"
        );


      if (
        !product ||
        !quantityElement ||
        !totalElement
      ) {

        return;

      }


      let quantity =
        Number(quantityElement.textContent);


      quantity += Number(change);


      quantity =
        Math.max(1, quantity);


      quantityElement.textContent =
        quantity;


      totalElement.textContent =
        (product.price * quantity)
          .toLocaleString() +
        " RWF";

    }


    window.changeDetailsQuantity =
      changeDetailsQuantity;


    function addDetailsToCart(productId) {

      const quantityElement =
        document.getElementById(
          "detailsQuantity"
        );


      if (!quantityElement) {
        return;
      }


      const quantity =
        Number(quantityElement.textContent);


      const product =
        products.find(function (p) {

          return p.id === Number(productId);

        });


      if (!product) {
        return;
      }


      const cartItem =
        cart.find(function (item) {

          return item.id === Number(productId);

        });


      if (cartItem) {

        cartItem.quantity += quantity;

      } else {

        cart.push({
          id: product.id,
          name: product.name,
          category: product.category,
          price: product.price,
          image: product.image,
          description: product.description,
          quantity: quantity
        });

      }


      saveCart();

      closeProductDetails();


      showToast(
        quantity +
        " " +
        product.name +
        " added to cart!"
      );

    }


    window.addDetailsToCart =
      addDetailsToCart;


    function closeProductDetails(event) {

      if (
        event &&
        event.target !== detailsModal
      ) {
        return;
      }


      detailsModal.classList.add("hidden");


      filterSection.classList.remove("hidden");

      productGrid.classList.remove("hidden");


      localStorage.removeItem(
        "selectedProductId"
      );


      document.body.classList.remove(
        "details-page-active"
      );


      document.body.style.overflow = "";

    }


    window.closeProductDetails =
      closeProductDetails;


    function increaseQuantity(productId) {

      productId = Number(productId);


      const cartItem =
        cart.find(function (item) {

          return item.id === productId;

        });


      if (cartItem) {
        cartItem.quantity += 1;
      }


      saveCart();

    }


    window.increaseQuantity =
      increaseQuantity;


    function decreaseQuantity(productId) {

      productId = Number(productId);


      const cartItem =
        cart.find(function (item) {

          return item.id === productId;

        });


      if (!cartItem) {
        return;
      }


      cartItem.quantity -= 1;


      if (cartItem.quantity <= 0) {

        removeFromCart(productId);

        return;

      }


      saveCart();

    }


    window.decreaseQuantity =
      decreaseQuantity;


    function removeFromCart(productId) {

      productId = Number(productId);


      cart =
        cart.filter(function (item) {

          return item.id !== productId;

        });


      saveCart();


      showToast(
        "Product removed from cart."
      );

    }


    window.removeFromCart =
      removeFromCart;


    function clearCart() {

      if (cart.length === 0) {

        showToast("Cart is already empty.");

        return;
      }


      if (
        !confirm(
          "Are you sure you want to clear the cart?"
        )
      ) {

        return;

      }


      cart = [];


      saveCart();


      showToast(
        "Cart cleared."
      );

    }


    window.clearCart = clearCart;


    function updateCartUI() {

      const totalCount =
        cart.reduce(
          function (sum, item) {

            return (
              sum +
              Number(item.quantity)
            );

          },
          0
        );


      cartBadge.textContent =
        totalCount;


      cartTableBody.innerHTML = "";


      if (cart.length === 0) {

        cartTableBody.innerHTML = `

          <tr>

            <td
              colspan="5"
              style="text-align:center;">

              Your cart is empty.

            </td>

          </tr>

        `;

      } else {

        cart.forEach(function (item) {

          const lineTotal =
            Number(item.price) *
            Number(item.quantity);


          cartTableBody.innerHTML += `

            <tr>

              <td>
                ${item.name}
              </td>

              <td>
                ${Number(item.price).toLocaleString()} RWF
              </td>

              <td>
                ${item.quantity}
              </td>

              <td>
                ${lineTotal.toLocaleString()} RWF
              </td>

              <td>

                <button
                  type="button"
                  class="cart-actions-btn btn-increase"
                  onclick="increaseQuantity(${item.id})">
                  +
                </button>

                <button
                  type="button"
                  class="cart-actions-btn btn-decrease"
                  onclick="decreaseQuantity(${item.id})">
                  -
                </button>

                <button
                  type="button"
                  class="cart-actions-btn btn-remove"
                  onclick="removeFromCart(${item.id})">
                  Remove
                </button>

              </td>

            </tr>

          `;

        });

      }


      const subtotal =
        cart.reduce(
          function (sum, item) {

            return (
              sum +
              Number(item.price) *
              Number(item.quantity)
            );

          },
          0
        );


      const vat =
        subtotal * 0.18;


      const grandTotal =
        subtotal + vat;


      document.getElementById(
        "subtotalVal"
      ).textContent =
        subtotal.toLocaleString() +
        " RWF";


      document.getElementById(
        "vatVal"
      ).textContent =
        vat.toLocaleString() +
        " RWF";


      document.getElementById(
        "grandTotalVal"
      ).textContent =
        grandTotal.toLocaleString() +
        " RWF";

    }


    window.updateCartUI =
      updateCartUI;


    function checkout() {

      if (cart.length === 0) {

        alert(
          "Your cart is empty!"
        );

        return;
      }


      const subtotal =
        cart.reduce(
          function (sum, item) {

            return (
              sum +
              Number(item.price) *
              Number(item.quantity)
            );

          },
          0
        );


      const vat =
        subtotal * 0.18;


      const grandTotal =
        subtotal + vat;


      alert(
        "Thank you for your purchase!\n\n" +
        "Total: " +
        grandTotal.toLocaleString() +
        " RWF\n\n" +
        "Your order has been placed successfully."
      );


      cart = [];


      saveCart();


      closeCart();

    }


    window.checkout = checkout;


    function toggleCartView() {

      if (
        !detailsModal.classList.contains("hidden")
      ) {

        closeProductDetails();

      }


      cartSection.classList.toggle("hidden");


      if (
        !cartSection.classList.contains("hidden")
      ) {

        filterSection.classList.add("hidden");

        productGrid.classList.add("hidden");

        updateCartUI();

      } else {

        filterSection.classList.remove("hidden");

        productGrid.classList.remove("hidden");

      }

    }


    window.toggleCartView =
      toggleCartView;


    function closeCart() {

      cartSection.classList.add("hidden");

      filterSection.classList.remove("hidden");

      productGrid.classList.remove("hidden");

    }


    window.closeCart =
      closeCart;


    function toggleDarkMode() {

      document.body.classList.toggle(
        "dark-mode"
      );


      localStorage.setItem(
        "darkMode",
        document.body.classList.contains(
          "dark-mode"
        )
      );

    }


    window.toggleDarkMode =
      toggleDarkMode;


    function showLoginForm() {

      signupForm.classList.add("hidden");

      loginForm.classList.remove("hidden");

      dashboardSection.classList.add("hidden");

      headerActions.classList.add("hidden");

      document.getElementById(
        "loginError"
      ).style.display = "none";

    }


    window.showLoginForm =
      showLoginForm;


    function showSignupForm() {

      signupForm.classList.remove("hidden");

      loginForm.classList.add("hidden");

      dashboardSection.classList.add("hidden");

      headerActions.classList.add("hidden");

      document.getElementById(
        "signupError"
      ).style.display = "none";

    }


    window.showSignupForm =
      showSignupForm;


    function showDashboard() {

      const currentUser =
        JSON.parse(
          localStorage.getItem(
            "currentUser"
          )
        );


      if (!currentUser) {

        showLoginForm();

        return;

      }


      signupForm.classList.add("hidden");

      loginForm.classList.add("hidden");

      dashboardSection.classList.remove("hidden");

      headerActions.classList.remove("hidden");


      userInfoDisplay.textContent =
        "👤 " +
        currentUser.username;


      closeCart();

      closeProductDetails();

      filterProducts();

      updateCartUI();

      updateKigaliClock();

    }


    window.showDashboard =
      showDashboard;


    if (
      localStorage.getItem("darkMode") === "true"
    ) {

      document.body.classList.add(
        "dark-mode"
      );

    }


    if (
      localStorage.getItem("currentUser")
    ) {

      showDashboard();

    } else {

      showSignupForm();

    }

  </script>

</body>

</html>
