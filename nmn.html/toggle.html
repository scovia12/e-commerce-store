    <title>Document</title> <style>/* 1. Define default Light Mode colors */
:root {
  --background: #ffffff;
  --text-color: #222222;
  --card-bg: #f0f0f0;
}

/* 2. Define Dark Mode overrides */
body.dark-theme {
  --background: #1a1a1a;
  --text-color: #f5f5f5;
  --card-bg: #2d2d2d;
}

/* 3. Apply the variables to elements */
body {
  background-color: var(--background);
  color: var(--text-color);
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  /* Smooth transition when switching themes */
  transition: background-color 0.3s ease, color 0.3s ease;
}

.card {
  background-color: var(--card-bg);
  padding: 2rem;
  border-radius: 12px;
  text-align: center;
  transition: background-color 0.3s ease;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  background-color: var(--text-color);
  color: var(--background);
  cursor: pointer;
  font-size: 1rem;
}</style>
</head>
