<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(223, 224, 225);
            margin: 0;
            padding-top: 70px;
        }

        nav {
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 60px;
            background-color: rgb(74, 186, 101);
            padding: 0 20px;
            z-index: 1000;
        }

        nav h3 {
            background-color: blueviolet;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        #searchinput {
            width: 300px;
            height: 35px;
            border: none;
            border-radius: 10px;
            padding: 5px 15px;
            background-color: blanchedalmond;
            outline: none;
        }

        #searchinput:focus {
            border: 2px solid blueviolet;
        }

        #cartbtn,
        #logoutbtn {
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 20px;
        }

        #cartbtn {
            background-color: rgb(186, 215, 205);
            width: 110px;
        }

        #cartbtn:hover {
            background-color: white;
        }

        #logoutbtn {
            background-color: crimson;
            color: white;
        }

        #logoutbtn:hover {
            background-color: darkred;
        }

        #products {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 15px;
            padding: 20px;
        }

        #products .card {
            flex: 0 1 calc(33.33% - 20px);
            padding: 20px;
            background-color: aqua;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        #products .card h2 {
            text-transform: capitalize;
        }

        #products .card button {
            background-color: rgb(114, 114, 193);
            border-radius: 6px;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            margin: 5px;
        }

        #products .card button:hover {
            background-color: rgb(19, 81, 81);
        }

        #cart {
            background-color: rgb(213, 171, 188);
            border-radius: 10px;
            position: fixed;
            text-align: center;
            overflow-y: auto;
            width: 350px;
            height: 500px;
            right: 15px;
            top: 70px;
            padding: 15px;
            display: none;
            z-index: 2000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        #closebtn {
            background-color: crimson;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        #closebtn:hover {
            background-color: darkred;
        }

        #cart .cart {
            background-color: rgb(78, 231, 147);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        .quantity-btn {
            background-color: rgb(74, 186, 101);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .quantity-btn:hover {
            background-color: green;
        }

        .quantity-number {
            font-weight: bold;
            min-width: 30px;
            display: inline-block;
            font-size: 18px;
        }

        .remove-btn {
            background-color: crimson;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background-color: darkred;
        }

        .cart-total {
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }

        .details {
            background-color: rgb(78, 231, 147);
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .details button {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            margin: 5px;
        }

        .add-details-btn {
            background-color: rgb(74, 186, 101);
            color: white;
        }

        .add-details-btn:hover {
            background-color: green;
        }

        .close-details-btn {
            background-color: crimson;
            color: white;
        }

        .close-details-btn:hover {
            background-color: darkred;
        }

        @media (max-width: 800px) {
            #products .card {
                flex: 0 1 calc(50% - 10px);
            }

            #searchinput {
                width: 200px;
            }
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 10px;
            }

            #products .card {
                flex: 0 1 100%;
            }

            #searchinput {
                width: 150px;
            }

            #cart {
                width: 90%;
                right: 5%;
            }
        }
        
    .form-box {
      background-color: rgb(134, 231, 78);
      padding: 30px;
      border-radius: 15px;
      width: 340px;
      box-shadow: 0 10px 25px rgba(238, 17, 17, 0.15);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .form-box h2 { 
      text-align: center; 
      margin-bottom: 10px; 
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group input {
      padding: 8px;
      border: 1px solid #f806a3;
      border-radius: 4px;
      outline: none;
    }
    .form-box hidden{
        background-color: rgb(151, 255, 31);
    }
    </style>
</head>

<body>

    <nav>
        <h3>S</h3>

        <div id="search">
            <input
                type="text"
                id="searchinput"
                placeholder="Search any product"
            >
        </div>

        <button id="logoutbtn">
            Logout
        </button>

        <button id="cartbtn">
            Cart: 0
        </button>
    </nav>

    <div id="cart">
        <h2>My Cart</h2>

        <button id="closebtn">
            Close
        </button>

        <div id="cartList"></div>
    </div>

    <div id="products"></div>
    <form class="form-box" id="signupForm">
      <h2>Sign Up</h2>
      <div class="error-msg" id="signupError"></div>
      <div class="form-group">
        <label>User name:</label>
        <input type="text" id="signupUser" required />
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="signupEmail" required />
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="signupPass" required />
      </div>
      <button type="submit" class="btn-submit"id="signupBtn">Sign Up</button>
      <p class="switch-text">Already have an account?
         <a onclick="showLoginForm()"><button id="loginnow">Log in here</button></a></p>
    </form>

    <!-- 2. LOG IN FORM -->
    <form class="form-box hidden" id="loginForm">
      <h2>Log In</h2>
      <div class="error-msg" id="loginError"></div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="loginEmail" required />
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="loginPass" required />
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">Log In</button>
      <p class="switch-text">Don't have an account? <a onclick="showSignupForm()"><button id="sign">Sign up here</button></a></p>
        </form>

    <script>
        let productsList = [
            {
                name: "shoes",
                category: "fashion",
                description: "Comfortable running shoes for everyday wear.",
                price: 35000
            },
            {
                name: "laptop",
                category: "electronic",
                description: "High-performance laptop for work and gaming.",
                price: 300000
            },
            {
                name: "techno",
                category: "electronic",
                description: "Latest smartphone with advanced features.",
                price: 150000
            },
            {
                name: "smart watch",
                category: "electronic",
                description: "Smartwatch with health monitoring features.",
                price: 35000
            },
            {
                name: "salade",
                category: "food",
                description: "Fresh and healthy salad with a variety of vegetables.",
                price: 15000
            },
            {
                name: "chocolate",
                category: "food",
                description: "Delicious chocolate bar made from premium cocoa.",
                price: 1500
            }
        ];

        let cartbtn = document.getElementById("cartbtn");
        let products = document.getElementById("products");
        let searchinput = document.getElementById("searchinput");
        let cart = document.getElementById("cart");
        let closebtn = document.getElementById("closebtn");
        let cartListDiv = document.getElementById("cartList");
        let logoutbtn = document.getElementById("logoutbtn");
        let signupForm = document.getElementById("signupForm");
        let loginForm = document.getElementById("loginForm");
        let signupBtn = document.getElementById("signupBtn");
        let signBtn = document.getElementById("sign");
        let loginnowBtn = document.getElementById("loginnow");
        function displayProducts(list) {
            products.innerHTML = "";

            if (list.length === 0) {
                products.innerHTML = `
                    <div class="card">
                        <h3>Product not found</h3>
                    </div>
                `;
                return;
            }

            list.forEach(function(product) {
                let originalIndex = productsList.indexOf(product);

                products.innerHTML += `
                    <div class="card">
                        <h2>${product.name}</h2>

                        <p>
                            <strong>Category:</strong>
                            ${product.category}
                        </p>

                        <h3>
                            Price:
                            RWF ${product.price.toLocaleString()}
                        </h3>

                        <button onclick="AddToCart(${originalIndex})">
                            Add to Cart
                        </button>

                        <button onclick="ViewDetails(${originalIndex})">
                            View Details
                        </button>
                    </div>
    
                `;
            });
        }

        displayProducts(productsList);

        searchinput.addEventListener("input", function() {
            let searchText = searchinput.value.toLowerCase().trim();

            let matchingProducts = productsList.filter(function(product) {
                return (
                    product.name.toLowerCase().includes(searchText) ||
                    product.category.toLowerCase().includes(searchText)
                );
            });

            displayProducts(matchingProducts);
        });

        function AddToCart(index, quantity = 1) {
            let cartList =
                JSON.parse(localStorage.getItem("cart")) || [];

            let product = productsList[index];

            let existingItem =
                cartList.find(item => item.name === product.name);

            if (existingItem) {
                existingItem.quantity =
                    (existingItem.quantity || 1) + quantity;
            } else {
                cartList.push({
                    ...product,
                    quantity: quantity
                });
            }

            localStorage.setItem(
                "cart",
                JSON.stringify(cartList)
            );

            countCart();
            showCart();

            cart.style.display = "block";
        }

        function countCart() {
            let cartList =
                JSON.parse(localStorage.getItem("cart")) || [];

            let count = cartList.reduce(function(total, item) {
                return total + (item.quantity || 1);
            }, 0);

            cartbtn.innerHTML = `Cart: ${count}`;
        }

        cartbtn.addEventListener("click", function() {
            cart.style.display = "block";
            showCart();
        });

        closebtn.addEventListener("click", function() {
            cart.style.display = "none";
        });
        logoutbtn.addEventListener("click", function() {
            loginForm.style.display = "block";
            signupForm.style.display = "none";
            products.style.display = "none";
            signupBtn.style.display = "block";
            logoutbtn.style.display = "none";
            searchinput.style.display = "none";
            cartbtn.style.display = "none";
        });
        signBtn.addEventListener("click", function() {
            signupForm.style.display = "block";
            loginForm.style.display = "none";
            products.style.display = "none";
            signupBtn.style.display = "block";
        });
        loginnow.addEventListener("click", function() {
            loginForm.style.display = "block";
            signupForm.style.display = "none";
            products.style.display = "none";
            signupBtn.style.display = "block";
            
        });
        function showCart() {
            let cartList =
                JSON.parse(localStorage.getItem("cart")) || [];

            cartListDiv.innerHTML = "";

            if (cartList.length === 0) {
                cartListDiv.innerHTML = `
                    <p>Your cart is empty.</p>
                `;
                return;
            }

            let total = 0;

            cartList.forEach(function(product, index) {
                let quantity = product.quantity || 1;
                let itemTotal = product.price * quantity;

                total += itemTotal;

                cartListDiv.innerHTML += `
                    <div class="cart">

                        <h3>${product.name}</h3>

                        <p>
                            Category:
                            ${product.category}
                        </p>

                        <p>
                            Price per item:
                            RWF ${product.price.toLocaleString()}
                        </p>

                        <div class="quantity-controls">

                            <button
                                class="quantity-btn"
                                onclick="decreaseCartQuantity(${index})">
                                −
                            </button>

                            <span class="quantity-number">
                                ${quantity}
                            </span>

                            <button
                                class="quantity-btn"
                                onclick="increaseCartQuantity(${index})">
                                +
                            </button>

                        </div>

                        <p>
                            Total amount:
                            <strong>
                                RWF ${itemTotal.toLocaleString()}
                            </strong>
                        </p>

                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>
                `;
            });

            cartListDiv.innerHTML += `
                <div class="cart-total">
                    Total:
                    RWF ${total.toLocaleString()}
                </div>
            `;
        }

        function increaseCartQuantity(index) {
            let cartList =
                JSON.parse(localStorage.getItem("cart")) || [];

            cartList[index].quantity =
                (cartList[index].quantity || 1) + 1;

            localStorage.setItem(
                "cart",
                JSON.stringify(cartList)
            );

            countCart();
            showCart();
        }

        function decreaseCartQuantity(index) {
            let cartList =
                JSON.parse(localStorage.getItem("cart")) || [];

            cartList[index].quantity =
                (cartList[index].quantity || 1) - 1;

            if (cartList[index].quantity <= 0) {
                cartList.splice(index, 1);
            }

            localStorage.setItem(
                "cart",
                JSON.stringify(cartList)
            );

            countCart();
            showCart();
        }

        function removeItem(index) {
            let cartList =
                JSON.parse(localStorage.getItem("cart")) || [];

            cartList.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cartList)
            );

            countCart();
            showCart();
        }

        function ViewDetails(index) {
            let product = productsList[index];
            let quantity = 1;

            products.innerHTML = `
                <div class="details">

                    <h3>Product Details</h3>

                    <h2>${product.name}</h2>

                    <p>
                        <strong>Category:</strong>
                        ${product.category}
                    </p>
                    <p>
                        <strong>Description:</strong>
                        ${product.description}
                    </p>

                    <p>
                        <strong>Price per item:</strong>
                        RWF
                        <span id="price">
                            ${product.price.toLocaleString()}
                        </span>
                    </p>

                    <div class="quantity-controls">

                        <button
                            class="quantity-btn"
                            id="decrease-quantity">
                            −
                        </button>

                        <span
                            class="quantity-number"
                            id="quantity">
                            1
                        </span>

                        <button
                            class="quantity-btn"
                            id="increase-quantity">
                            +
                        </button>

                    </div>

                    <p>
                        <strong>Total:</strong>
                        RWF
                        <span id="details-total">
                            ${product.price.toLocaleString()}
                        </span>
                    </p>

                    <button
                        class="add-details-btn"
                        id="addcart">
                        Add to Cart
                    </button>

                    <button
                        class="close-details-btn"
                        onclick="displayProducts(productsList)">
                        Close
                    </button>

                </div>
            `;

            document
                .getElementById("increase-quantity")
                .addEventListener("click", function() {
                    quantity++;

                    document
                        .getElementById("quantity")
                        .textContent = quantity;

                    document
                        .getElementById("details-total")
                        .textContent =
                        (product.price * quantity)
                        .toLocaleString();
                });

            document
                .getElementById("decrease-quantity")
                .addEventListener("click", function() {
                    if (quantity > 1) {
                        quantity--;

                        document
                            .getElementById("quantity")
                            .textContent = quantity;

                        document
                            .getElementById("details-total")
                            .textContent =
                            (product.price * quantity)
                            .toLocaleString();
                    }
                });

            document
                .getElementById("addcart")
                .addEventListener("click", function() {
                    AddToCart(index, quantity);
                });
        }

        countCart();
        showCart();
    </script>

</body>
</html>
